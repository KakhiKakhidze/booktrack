services:
  - type: web
    name: booktrack-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard
      - key: DB_NAME
        value: bookDB
      - key: NODE_VERSION
        value: 18.20.0

